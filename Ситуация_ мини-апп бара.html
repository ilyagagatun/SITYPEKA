<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ситуация: мини-апп</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #e46fb1;
        --pink2: #f5aac9;
        --cream: #fffbe8;
        --yellow: #fcf5b4;
        --rose: #fae6e8;
        --ink: #1b1220;
        --bg: #fffdf6;
        --card: #fff;
        --txt: #1b1220;
        --mut: #6d5a70;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1d1322;
          --card: #2a1c30;
          --txt: #fff3f8;
          --mut: #c3a9c9;
          --ink: #0c0710;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1d1322;
        --card: #2a1c30;
        --txt: #fff3f8;
        --mut: #c3a9c9;
        --ink: #0c0710;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--txt);
        font:
          500 15px/1.35 Rubik,
          system-ui,
          sans-serif;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
        max-width: 520px;
        margin: auto;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px 20px;
      }
      .logo {
        font-family: "Rubik Mono One", Impact, sans-serif;
        color: var(--pink);
        font-size: 30px;
        line-height: 0.95;
        -webkit-text-stroke: 2px #1b1220;
        paint-order: stroke fill;
        text-shadow: 3px 3px 0 #1b1220;
        text-align: center;
        margin: 6px 0 14px;
        letter-spacing: 0.5px;
      }
      h2 {
        font-family: "Rubik Mono One", Impact, sans-serif;
        font-size: 17px;
        color: var(--pink);
        -webkit-text-stroke: 1.5px #1b1220;
        paint-order: stroke fill;
        text-shadow: 2px 2px 0 #1b1220;
        margin: 4px 0 10px;
        font-weight: 400;
      }
      .box {
        border: 2px solid var(--ink);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 12px;
        background: var(--card);
        color: var(--txt);
      }
      .y {
        background: var(--yellow);
        color: #1b1220;
      }
      .p {
        background: var(--pink2);
        color: #1b1220;
      }
      .r {
        background: var(--rose);
        color: #1b1220;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
      }
      .k {
        font-size: 12px;
        color: var(--mut);
      }
      .y .k,
      .p .k,
      .r .k {
        color: #5b3a55;
      }
      .big {
        font-family: "Rubik Mono One", Impact, sans-serif;
        font-size: 24px;
        font-weight: 400;
      }
      .hit {
        display: inline-block;
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 50%;
        padding: 3px 9px;
        font: 700 11px Rubik;
        transform: rotate(-6deg);
        color: #1b1220;
      }
      button,
      .btn {
        font: 700 15px Rubik;
        border: 2px solid var(--ink);
        background: var(--pink);
        color: #fff;
        border-radius: 12px;
        padding: 12px 14px;
        width: 100%;
        box-shadow: 3px 3px 0 var(--ink);
        cursor: pointer;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      button:disabled {
        opacity: 0.45;
      }
      button.alt {
        background: var(--yellow);
        color: #1b1220;
        text-shadow: none;
      }
      :focus-visible {
        outline: 3px solid #1b1220;
        outline-offset: 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .chip {
        background: var(--yellow);
        color: #1b1220;
        border: 2px solid var(--ink);
        border-radius: 12px;
        padding: 10px;
        text-align: left;
        box-shadow: 2px 2px 0 var(--ink);
        text-shadow: none;
        font-weight: 500;
        font-size: 14px;
      }
      .chip.on {
        background: var(--pink);
        color: #fff;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      nav {
        display: flex;
        border-top: 2px solid var(--ink);
        background: var(--yellow);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      nav button {
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
        color: #1b1220;
        text-shadow: none;
        font-size: 11px;
        padding: 9px 2px;
        flex: 1;
      }
      nav button.on {
        background: var(--pink);
        color: #fff;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      }
      nav b {
        display: block;
        font-size: 19px;
      }
      /* /ASD */
      .item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px dashed rgba(27, 18, 32, 0.35);
      }
      .item:last-child {
        border: 0;
      }
      .item span {
        font: 700 14px Rubik;
      }
      .item small {
        display: block;
        font-weight: 400;
        font-size: 11px;
        color: var(--mut);
      }
      .y .item small,
      .p .item small,
      .r .item small {
        color: #5b3a55;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 6px;
      }
      .tabs .chip {
        white-space: nowrap;
        width: auto;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2fbf5b;
        border: 2px solid var(--ink);
        margin-right: 6px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
      }
      .step i {
        font-style: normal;
        width: 28px;
        height: 28px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #fff;
        color: #1b1220;
        font-weight: 700;
        flex: none;
      }
      .step.done i {
        background: var(--pink);
        color: #fff;
      }
      input,
      select {
        width: 100%;
        font: 500 15px Rubik;
        padding: 11px;
        border: 2px solid var(--ink);
        border-radius: 10px;
        background: #fff;
        color: #1b1220;
        margin: 4px 0 8px;
      }
      #push {
        position: fixed;
        left: 12px;
        right: 12px;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        max-width: 496px;
        margin: auto;
        background: var(--pink);
        color: #fff;
        border: 2px solid var(--ink);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 3px 3px 0 var(--ink);
        display: none;
        z-index: 9;
      }
      #wheelWrap {
        position: relative;
        width: min(300px, 80vw);
        aspect-ratio: 1;
        margin: 10px auto;
      }
      #wheel {
        width: 100%;
        height: 100%;
        transition: transform 4.5s cubic-bezier(0.12, 0.7, 0.1, 1);
      }
      #pin {
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border: 12px solid transparent;
        border-top: 26px solid var(--ink);
        border-bottom: 0;
        z-index: 2;
      }
      .ctr {
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        #wheel {
          transition-duration: 0.01s;
        }
      }
    </style>
  </head>
  <body>
    <div id="push" role="alert">
      <b>Внимание!</b><br />Через 5 минут в «Ситуации» наступает Новый год.
    </div>
    <div id="app">
      <main id="v"></main>
      <nav id="nav"></nav>
    </div>
    <script>
      var TABS = [
        ["home", "🏠", "Бар"],
        ["bar", "🍸", "ИИ-бармен"],
        ["wheel", "🎡", "Колесо"],
        ["promo", "🔥", "Акции"],
        ["menu", "📖", "Меню"],
        ["book", "📅", "Стол"],
      ];
      var SIT = {
        "Отмечаю повышение": [
          "Ситуация ‘Винтаж’",
          "Тирамису",
          "Что-то сытное и «дорогое» на вкус",
        ],
        Расстался: [
          "Ситуация ‘Я остаюсь’",
          "Вишня+лаванда",
          "Тёплое и утешительное",
        ],
        "Зарплата пришла": [
          "Ситуация ‘Папа вернулся’",
          "Сет авторских шотов, 6 шт",
          "Большое блюдо на компанию",
        ],
        "Зарплата ещё не пришла": [
          "Джин–тоник",
          "Малина+мята",
          "Лёгкая закуска за небольшие деньги",
        ],
        "Хочу приключений": [
          "Ситуация ‘S.O.S.’",
          "Крыжовник+зелёный чай",
          "Острое и неожиданное",
        ],
        "Хочу расслабиться": [
          "Негрони",
          "Миндаль в карамели",
          "Сырная тарелка",
        ],
        "Я сегодня мексиканец": [
          "Маргарита",
          "Эль Амо, текила",
          "Начос и гуакамоле",
        ],
        "Новый год наступил раньше времени": [
          "Пунш Гусарский XXXL",
          "‘Соник’ XXXL",
          "Праздничное ассорти на всех",
        ],
        "Пятница без тормозов": [
          "Лонг Айленд",
          "Сет шотов Б-52",
          "Что-то, что можно есть руками",
        ],
      };
      var MENU = {
        Авторские: [
          ["Гранд шот ‘Соник’", "400", "Яблоко, цитрус, джин Broom. 80 мл"],
          ["‘Папа вернулся’", "720", "Персик, ваниль, ром бланко"],
          ["‘3.14здец’", "720", "Яблоко, лайм-мята, игристое"],
          ["‘Винтаж’", "720", "Сливки, имбирный пряник, ром"],
          ["‘French Kiss’", "720", "Грейпфрут, кокосовая вода, водка"],
          ["‘Я остаюсь’", "720", "Вишня, корица, апельсин, бурбон"],
          ["‘Обманчива’", "720", "Какао-бобы, апельсиновый ликёр, джин"],
          ["‘Shake It’", "720", "Маракуйя, ваниль, Broom Pink"],
          ["‘S.O.S.’ NEW", "720", "Ром, ликёр, блю кюрасао, ананас"],
        ],
        Шоты: [
          ["Миндаль в карамели", "250", "50 мл"],
          ["Малина+мята", "250", "50 мл"],
          ["Маракуйя", "250", "50 мл"],
          ["Вишня+лаванда", "250", "50 мл"],
          ["Крыжовник+зелёный чай", "250", "50 мл"],
          ["Клюква+дахунпао", "250", "50 мл"],
          ["Щавель+базилик", "250", "50 мл"],
          ["Тирамису", "250", "50 мл"],
          ["Сет одного вкуса", "1200", "6 шт"],
        ],
        Классика: [
          ["Джин–тоник", "650", "Broom, тоник"],
          ["Виски–кола", "650", "Harats, кола"],
          ["Куба-либре", "650", "Белый ром, кола"],
          ["Негрони", "650", "Джин, Campari, вермут"],
          ["Дайкири", "650", "Белый ром, сахар, лимон"],
          ["Маргарита", "650", "Текила, ликёр, лимон"],
          ["Москоу мул", "650", "Водка, имбирный эль"],
          ["Виски сауэр", "650", "Бурбон, лимон, бабл дроп"],
          ["Фиеро-тоник", "650", "Мартини Фиеро, тоник"],
          ["Олд-фэшн", "650", "Бурбон, ангостура"],
          ["Апероль спритц", "700", "Апероль, игристое"],
          ["Лонг Айленд", "950", "350 мл"],
        ],
        "Пунш (хит)": [
          ["Сет Б-52", "3000", "6 шт по 50 мл"],
          ["‘Соник’ XXXL", "3500", "9 шт по 80 мл"],
          ["Пунш Кон-Тики XXXL", "4500", "3 вида рома, ананас, 2 л"],
          ["Пунш Гусарский XXXL", "4500", "Игристое, груша, ягоды, 2 л"],
        ],
        Крепкое: [
          ["Текила бланко", "350", ""],
          ["Broom Dry Gin", "450", ""],
          ["Ром бланко", "350", ""],
          ["Белая берёзка", "250", "Водка"],
          ["Harats", "350", "Виски"],
          ["Коктебель 5*", "650", "Коньяк"],
        ],
        Вино: [
          ["Badagoni Цинандали", "450", "Белое, 150 мл"],
          ["Пино Гриджио", "550", "Белое, 150 мл"],
          ["Мальбек", "550", "Красное, 150 мл"],
          ["Кьянти", "620", "Красное, 150 мл"],
          ["Домашнее игристое", "450", "150 мл"],
          ["Просекко", "790", "150 мл"],
        ],
      };
      var PRIZES = [
        ["Шот за 1 ₽", "#fcf5b4"],
        ["Скидка 10%", "#f5aac9"],
        ["Подарок к заказу", "#fae6e8"],
        ["Второй коктейль −50%", "#fcf5b4"],
        ["Секретный коктейль", "#f5aac9"],
      ];
      var st = {
        tab: "home",
        sit: null,
        cat: "Авторские",
        steps: 0,
        rot: 0,
        prize: null,
        ok: false,
        booked: false,
      };
      var $ = function (i) {
        return document.getElementById(i);
      };
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function nav() {
        $("nav").innerHTML = TABS.map(function (t) {
          return (
            '<button data-t="' +
            t[0] +
            '" class="' +
            (st.tab == t[0] ? "on" : "") +
            '"><b>' +
            t[1] +
            "</b>" +
            t[2] +
            "</button>"
          );
        }).join("");
        $("nav").onclick = function (e) {
          var b = e.target.closest("button");
          if (b) {
            st.tab = b.dataset.t;
            render();
          }
        };
      }
      function mins() {
        var d = new Date();
        return 60 - d.getMinutes();
      }
      function logo() {
        return '<div class="logo">СИТУАЦИЯ:<br>ПИТЬ</div>';
      }
      var V = {
        home: function () {
          return (
            logo() +
            '<div class="box y"><span class="dot"></span><b>Сейчас в баре</b><div class="row" style="margin-top:10px"><div><div class="k">Загруженность</div><div class="big">Средняя</div></div><div><div class="k">До Нового года</div><div class="big" id="ny">' +
            mins() +
            " мин</div></div></div></div>" +
            '<div class="row"><div class="box r"><div class="k">Mexico Time</div><div class="big" style="font-size:18px">неизвестно</div></div><div class="box p"><span class="hit">ХИТ</span><div class="k" style="margin-top:6px">Коктейль дня</div><b>‘Папа вернулся’</b><div class="k">720 ₽</div></div></div>' +
            '<div class="box"><b>Акция за репост</b><div class="k">Коктейль в подарок за репост в канале</div><button style="margin-top:10px" data-go="promo">Забрать</button></div>' +
            '<button class="alt" id="pushbtn">Показать пуш про Новый год</button>'
          );
        },
        bar: function () {
          var h = logo().replace(
            "СИТУАЦИЯ:<br>ПИТЬ",
            "КАКАЯ У ТЕБЯ<br>СИТУАЦИЯ?",
          );
          h = h.replace("font-size:30px", "");
          var o =
            '<div class="logo" style="font-size:22px">КАКАЯ У ТЕБЯ<br>СЕГОДНЯ СИТУАЦИЯ?</div><div class="grid">';
          Object.keys(SIT).forEach(function (k) {
            o +=
              '<button class="chip ' +
              (st.sit == k ? "on" : "") +
              '" data-s="' +
              esc(k) +
              '">' +
              esc(k) +
              "</button>";
          });
          o += "</div>";
          if (st.sit) {
            var r = SIT[st.sit];
            o +=
              '<div style="margin-top:14px"><h2>ИИ-бармен советует</h2><div class="box y"><div class="k">Коктейль</div><b>' +
              esc(r[0]) +
              '</b></div><div class="box p"><div class="k">Шот</div><b>' +
              esc(r[1]) +
              '</b></div><div class="box r"><div class="k">Блюдо</div><b>' +
              esc(r[2]) +
              '</b></div><button data-go="menu">Открыть меню</button></div>';
          }
          return o;
        },
        wheel: function () {
          var n = PRIZES.length,
            a = 360 / n,
            s = "";
          PRIZES.forEach(function (p, i) {
            var x1 = 150 + 140 * Math.sin((i * a * Math.PI) / 180),
              y1 = 150 - 140 * Math.cos((i * a * Math.PI) / 180),
              x2 = 150 + 140 * Math.sin(((i + 1) * a * Math.PI) / 180),
              y2 = 150 - 140 * Math.cos(((i + 1) * a * Math.PI) / 180),
              m = (i + 0.5) * a;
            s +=
              '<path d="M150 150L' +
              x1 +
              " " +
              y1 +
              "A140 140 0 0 1 " +
              x2 +
              " " +
              y2 +
              'Z" fill="' +
              p[1] +
              '" stroke="#1b1220" stroke-width="3"/><text transform="rotate(' +
              m +
              ' 150 150)" x="150" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#1b1220" font-family="Rubik">' +
              esc(p[0].split(" ").slice(0, 2).join(" ")) +
              '</text><text transform="rotate(' +
              m +
              ' 150 150)" x="150" y="66" text-anchor="middle" font-size="10" fill="#1b1220" font-family="Rubik">' +
              esc(p[0].split(" ").slice(2).join(" ")) +
              "</text>";
          });
          return (
            '<h2>Колесо ситуаций</h2><div class="box"><div class="k">Колесо открывается от 3000 ₽ в чеке</div><input id="chk" type="number" inputmode="numeric" placeholder="Сумма чека, ₽" value="3500" aria-label="Сумма чека"></div><div id="wheelWrap"><div id="pin"></div><svg id="wheel" viewBox="0 0 300 300" style="transform:rotate(' +
            st.rot +
            'deg)"><circle cx="150" cy="150" r="146" fill="#1b1220"/>' +
            s +
            '<circle cx="150" cy="150" r="16" fill="#e46fb1" stroke="#1b1220" stroke-width="3"/></svg></div><button id="spin">Крутить</button><div id="prz" class="ctr box y" style="margin-top:12px;display:' +
            (st.prize ? "block" : "none") +
            '"><div class="k">Твой приз</div><div class="big" style="font-size:18px">' +
            esc(st.prize || "") +
            '</div><div class="k">Покажи экран бармену</div></div>'
          );
        },
        promo: function () {
          var S = [
            "Нажми кнопку",
            "Перейди в Telegram-канал",
            "Сделай репост",
            "Вернись в приложение",
          ];
          var o =
            '<h2>Акции</h2><div class="box p"><span class="hit">ХИТ</span><div class="big" style="font-size:19px;margin:6px 0">Коктейль за репост</div><div class="k">Репост в канале бара — коктейль в подарок</div>';
          S.forEach(function (t, i) {
            o +=
              '<div class="step ' +
              (st.steps > i ? "done" : "") +
              '"><i>' +
              (st.steps > i ? "✓" : i + 1) +
              "</i>" +
              t +
              "</div>";
          });
          if (st.steps < 4)
            o +=
              '<button id="rp">' +
              (st.steps == 0
                ? "Поделиться"
                : st.steps == 1
                  ? "Я в канале"
                  : st.steps == 2
                    ? "Я сделал репост"
                    : "Вернулся") +
              "</button>";
          else
            o +=
              '<div class="ctr box" style="margin:8px 0 0"><canvas id="qr" width="168" height="168" aria-label="QR-код для бармена"></canvas><div class="k">QR-код для бармена · SIT-' +
              (st.code || "0000") +
              "</div></div>";
          o +=
            '</div><div class="box y"><b>Колесо ситуаций</b><div class="k">От 3000 ₽ в чеке — крутишь колесо и забираешь приз</div></div><div class="box r"><b>Коктейль дня</b><div class="k">‘Папа вернулся’ — 720 ₽</div></div><button class="alt" id="sh">Позвать друзей</button>';
          return o;
        },
        menu: function () {
          var o = '<h2>Меню</h2><div class="tabs">';
          Object.keys(MENU).forEach(function (k) {
            o +=
              '<button class="chip ' +
              (st.cat == k ? "on" : "") +
              '" data-c="' +
              k +
              '">' +
              k +
              "</button>";
          });
          o +=
            '</div><div class="box ' +
            {
              Авторские: "y",
              Шоты: "p",
              "Пунш (хит)": "y",
              Классика: "",
              Крепкое: "r",
              Вино: "r",
            }[st.cat] +
            '">';
          MENU[st.cat].forEach(function (i) {
            o +=
              '<div class="item"><div>' +
              esc(i[0]) +
              (i[2] ? "<small>" + esc(i[2]) + "</small>" : "") +
              "</div><span>" +
              i[1] +
              "</span></div>";
          });
          return o + "</div>";
        },
        book: function () {
          if (st.booked)
            return (
              logo() +
              '<div class="box y ctr"><div class="big" style="font-size:18px">Стол забронирован</div><div class="k" style="margin:6px 0 12px">Администратор подтвердит бронь в Telegram</div><button id="again">Новая бронь</button></div>'
            );
          return '<h2>Бронь стола</h2><div class="box"><label class="k" for="bn">Имя</label><input id="bn" placeholder="Как тебя зовут"><label class="k" for="bd">Дата</label><input id="bd" type="date"><label class="k" for="bt">Время</label><input id="bt" type="time" value="20:00"><label class="k" for="bg">Гостей</label><select id="bg"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7+</option></select><button id="bk">Забронировать</button></div>';
        },
      };
      function render() {
        nav();
        $("v").innerHTML = V[st.tab]();
        $("v").scrollTop = 0;
        bind();
      }
      function bind() {
        $("v")
          .querySelectorAll("[data-go]")
          .forEach(function (b) {
            b.onclick = function () {
              st.tab = b.dataset.go;
              render();
            };
          });
        $("v")
          .querySelectorAll("[data-s]")
          .forEach(function (b) {
            b.onclick = function () {
              st.sit = b.dataset.s;
              render();
              $("v").scrollTo({ top: 9999, behavior: "smooth" });
            };
          });
        $("v")
          .querySelectorAll("[data-c]")
          .forEach(function (b) {
            b.onclick = function () {
              st.cat = b.dataset.c;
              render();
            };
          });
        var p = $("pushbtn");
        if (p)
          p.onclick = function () {
            var e = $("push");
            e.style.display = "block";
            setTimeout(function () {
              e.style.display = "none";
            }, 4000);
          };
        var sp = $("spin");
        if (sp)
          sp.onclick = function () {
            var v = +$("chk").value;
            if (v < 3000) {
              alert("Нужен чек от 3000 ₽");
              return;
            }
            var i = Math.floor(Math.random() * PRIZES.length),
              a = 360 / PRIZES.length;
            st.rot += 1800 + (360 - (i + 0.5) * a) - (st.rot % 360);
            sp.disabled = true;
            $("wheel").style.transform = "rotate(" + st.rot + "deg)";
            setTimeout(function () {
              st.prize = PRIZES[i][0];
              sp.disabled = false;
              var z = $("prz");
              z.style.display = "block";
              z.querySelector(".big").textContent = st.prize;
            }, 4600);
          };
        var rp = $("rp");
        if (rp)
          rp.onclick = function () {
            if (st.steps == 0) {
              var u =
                "https://t.me/share/url?url=" +
                encodeURIComponent("https://t.me/your_bar_bot") +
                "&text=" +
                encodeURIComponent("Ситуация: пить!");
              window.open(u, "_blank");
            }
            st.steps++;
            if (st.steps == 4)
              st.code = String(Math.floor(1000 + Math.random() * 9000));
            render();
          };
        var q = $("qr");
        if (q) drawQR(q, st.code);
        var sh = $("sh");
        if (sh)
          sh.onclick = function () {
            window.open(
              "https://t.me/share/url?url=" +
                encodeURIComponent("https://t.me/your_bar_bot"),
              "_blank",
            );
          };
        var bk = $("bk");
        if (bk)
          bk.onclick = function () {
            if (!$("bn").value || !$("bd").value) {
              alert("Заполни имя и дату");
              return;
            }
            try {
              window.Telegram &&
                Telegram.WebApp &&
                Telegram.WebApp.sendData(
                  JSON.stringify({
                    n: $("bn").value,
                    d: $("bd").value,
                    t: $("bt").value,
                    g: $("bg").value,
                  }),
                );
            } catch (e) {}
            st.booked = true;
            render();
          };
        var ag = $("again");
        if (ag)
          ag.onclick = function () {
            st.booked = false;
            render();
          };
      }
      function drawQR(c, code) {
        var g = c.getContext("2d"),
          n = 21,
          s = 8,
          h = +code || 1;
        g.fillStyle = "#fff";
        g.fillRect(0, 0, 168, 168);
        g.fillStyle = "#1b1220";
        function eye(x, y) {
          g.fillRect(x * s, y * s, 7 * s, 7 * s);
          g.fillStyle = "#fff";
          g.fillRect((x + 1) * s, (y + 1) * s, 5 * s, 5 * s);
          g.fillStyle = "#1b1220";
          g.fillRect((x + 2) * s, (y + 2) * s, 3 * s, 3 * s);
        }
        for (var y = 0; y < n; y++)
          for (var x = 0; x < n; x++) {
            if ((x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12))
              continue;
            h = (h * 1103515245 + 12345) & 2147483647;
            if ((h >> 16) & 1) g.fillRect(x * s, y * s, s, s);
          }
        eye(0, 0);
        eye(14, 0);
        eye(0, 14);
      }
      setInterval(function () {
        var e = $("ny");
        if (e) e.textContent = mins() + " мин";
      }, 20000);
      try {
        window.Telegram &&
          Telegram.WebApp &&
          (Telegram.WebApp.ready(), Telegram.WebApp.expand());
      } catch (e) {}
      render();
    </script>
  </body>
</html>
